name: OpenWiki Update

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: openwiki-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: write
  pull-requests: write

jobs:
  openwiki-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://opencode.ai/zen/v1
          OPENWIKI_MODEL_ID: deepseek-v4-flash-free
          OPENWIKI_TELEMETRY_DISABLED: true

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: 'docs: update OpenWiki'
          title: 'docs: update OpenWiki'
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by a push to the dev branch with openwiki workflow.
